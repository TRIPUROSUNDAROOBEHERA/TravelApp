{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Logistics | tt+ Itinerary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc; 
            min-height: 100vh;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Modern Glass Card */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Form Styling */
        .form-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            color: #f1f5f9;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #990000;
            box-shadow: 0 0 0 2px rgba(153, 0, 0, 0.2);
            outline: none;
        }
        .input-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #2dd4bf; /* Teal accent like the screenshot */
            margin-bottom: 0.5rem;
            display: block;
        }

        .bg-brand-red { background-color: #990000; }
    </style>
</head>
<body class="flex flex-col">

    <div class="flex justify-between items-center px-10 py-6 bg-black/20 border-b border-white/5">
        <div class="flex items-center gap-3">
            <span class="text-[#990000] text-3xl font-black italic">tt<span class="text-xl">+</span></span>
            <span class="text-[10px] font-bold tracking-[0.3em] text-white/40 uppercase">Logistics</span>
        </div>
        <a href="{% url 'ViewHotel' %}" class="text-[10px] font-bold tracking-widest text-white/60 hover:text-white uppercase transition flex items-center gap-2">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Inventory
        </a>
    </div>

    <main class="flex-grow flex items-center justify-center p-6 py-12">
        <div class="glass-panel w-full max-w-2xl overflow-hidden animate-in fade-in zoom-in duration-500">
            
            <div class="p-10 pb-4 text-center border-b border-white/5">
                <h1 class="text-4xl font-serif font-bold text-white mb-2">Update Asset</h1>
                <p class="text-[10px] font-mono tracking-[0.4em] text-teal-400 uppercase">Editing Reference #{{ hotel_id }}</p>
            </div>

            <form action="ModifyHotelAction" method="post" class="p-10 space-y-6">
                {% csrf_token %}
                <input type="hidden" name="hotel_id" value="{{ hotel_id }}">

                <div>
                    <label class="input-label">Hotel Name / Identification</label>
                    <input type="text" name="t1" value="{{ hotel_name }}" class="form-input w-full px-5 py-3.5 rounded-xl text-sm" placeholder="e.g. Grand Hyatt">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="input-label">Room Number / ID</label>
                        <input type="text" name="t2" value="{{ room_number }}" class="form-input w-full px-5 py-3.5 rounded-xl text-sm" placeholder="e.g. 302-Luxury">
                    </div>
                    <div>
                        <label class="input-label">Location Hub</label>
                        <input type="text" name="t6" value="{{ location }}" class="form-input w-full px-5 py-3.5 rounded-xl text-sm" placeholder="City, Country">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="input-label">Entry Time</label>
                        <input type="text" name="t3" value="{{ entry_time }}" class="form-input w-full px-5 py-3.5 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="input-label">Ending Time</label>
                        <input type="text" name="t4" value="{{ ending_time }}" class="form-input w-full px-5 py-3.5 rounded-xl text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="input-label">Revised Rate (USD)</label>
                        <div class="relative">
                            <span class="absolute left-5 top-3.5 text-teal-500 font-bold">$</span>
                            <input type="text" name="t7" value="{{ price_night }}" class="form-input w-full pl-10 pr-5 py-3.5 rounded-xl text-sm font-mono text-teal-300">
                        </div>
                    </div>
                    <div>
                        <label class="input-label">Logistics Duration</label>
                        <input type="text" name="t5" value="{{ duration_desc }}" class="form-input w-full px-5 py-3.5 rounded-xl text-sm" placeholder="e.g. 3 Days">
                    </div>
                </div>

                <div>
                    <label class="input-label">Amenities & Services</label>
                    <textarea name="t8" rows="3" class="form-input w-full px-5 py-3.5 rounded-xl text-sm resize-none">{{ amenities }}</textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-6">
                    <button type="submit" class="bg-brand-red hover:bg-red-700 text-white font-bold py-4 rounded-xl text-[10px] uppercase tracking-widest transition-all shadow-lg active:scale-95">
                        Commit Changes
                    </button>
                    <a href="{% url 'ViewHotel' %}" class="bg-slate-800/50 hover:bg-slate-700 text-slate-300 font-bold py-4 rounded-xl text-[10px] uppercase tracking-widest text-center transition-all">
                        Cancel Update
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer class="py-8 text-center text-[10px] text-white/20 uppercase tracking-[0.4em] font-bold">
        Secure Terminal v2.6.4 // Data Core Active
    </footer>

</body>
</html>
