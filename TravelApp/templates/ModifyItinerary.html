{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify Itinerary | Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-slate-50">

    <header class="w-full bg-[#990000] shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-8 flex justify-end items-center">
            <a href="{% url 'ViewItinerary' %}" class="px-6 py-4 text-white text-xs font-bold uppercase hover:bg-[#7a0000] transition">← Back to List</a>
        </div>
    </header>

    <main class="flex-grow py-16 px-4">
        <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
            <div class="bg-slate-900 p-8 text-center">
                <h1 class="text-3xl font-serif font-bold text-white">Modify Package</h1>
                <p class="text-[#54b3a4] text-xs uppercase tracking-widest mt-2">Editing Record #{{ item.package_id }}</p>
            </div>

            <form method="POST" class="p-10 space-y-6">
                {% csrf_token %}
                <input type="hidden" name="pid" value="{{ item.package_id }}">
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Itinerary Name</label>
                    <input type="text" name="t1" value="{{ item.package_name }}" 
                           class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Attraction Description</label>
                    <textarea name="t2" rows="5" 
                              class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">{{ item.description }}</textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Package Price ($)</label>
                    <input type="text" name="t3" value="{{ item.price }}" 
                           class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                </div>

                <div class="pt-4 flex gap-4">
                    <button type="submit" class="flex-1 bg-[#990000] hover:bg-[#7a0000] text-white font-bold py-4 rounded-xl shadow-lg transition-all uppercase tracking-widest text-xs">
                        Save Changes
                    </button>
                    <a href="{% url 'ViewItinerary' %}" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-center font-bold py-4 rounded-xl transition-all uppercase tracking-widest text-xs">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-500 py-6 text-center text-[10px] uppercase tracking-widest">
        © 2026 Tripvel Travel | Edit Mode
    </footer>

</body>
</html>
